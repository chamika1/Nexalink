[package]
name = "nexalink-windows-agent"
version = "0.1.0"
edition = "2021"
description = "NexaLink Windows companion protocol prototype"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdh", "pkcs8", "ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
