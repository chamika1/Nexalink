name: Windows Agent Checks

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-agent.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-agent.yml'

concurrency:
  group: windows-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Test Rust protocol
        run: cargo test
      - name: Build Windows agent prototype
        run: cargo build --release
      - name: Upload Windows executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexalink-windows-agent-prototype
          path: desktop/target/release/nexalink-windows-agent.exe
          retention-days: 7
